name: Fact Drop Weekly Publish

on:
  schedule:
    # Runs every Thursday at 05:41 UTC (11:11 AM IST)
    - cron: '41 5 * * 4'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  publish-factdrop:
    name: Build & Publish Latest Fact Drop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Fact Drop Site
        run: |
          python scripts/factdrop/generate_factdrop.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/factdrop
          if git diff --staged --quiet; then
            echo "No new facts due or changes detected. Repository is already up to date."
          else
            git commit -m "Fact Drop: Auto-publish latest weekly drop"
            git push origin HEAD:main
            echo "Successfully published and pushed new fact drop!"
          fi
