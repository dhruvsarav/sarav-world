<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Swastikastra Favicon">
  <defs>
    <linearGradient id="glyphGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbe7b0" />
      <stop offset="55%" stop-color="#d9a441" />
      <stop offset="100%" stop-color="#8a5a1e" />
    </linearGradient>
    <filter id="glyphGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0a0603" />
  <g stroke="url(#glyphGold)" stroke-width="8.5" stroke-linecap="square" fill="none" filter="url(#glyphGlow)">
    <path d="M50,50 L50,16 L76,16" />
    <path d="M50,50 L50,16 L76,16" transform="rotate(90 50 50)" />
    <path d="M50,50 L50,16 L76,16" transform="rotate(180 50 50)" />
    <path d="M50,50 L50,16 L76,16" transform="rotate(270 50 50)" />
  </g>
</svg>
