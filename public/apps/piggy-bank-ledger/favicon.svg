<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18202C"/>
      <stop offset="100%" stop-color="#0C0F14"/>
    </linearGradient>
    <linearGradient id="piggyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9EB5"/>
      <stop offset="100%" stop-color="#FF6B8B"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#2A3545" stroke-width="2.5"/>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="none" stroke="#E3A63E" stroke-width="1" opacity="0.4"/>

  <!-- Piggy Bank Body -->
  <ellipse cx="62" cy="74" rx="34" ry="26" fill="url(#piggyGrad)"/>
  <!-- Head & Snout -->
  <circle cx="88" cy="70" r="16" fill="url(#piggyGrad)"/>
  <ellipse cx="98" cy="72" rx="7" ry="9" fill="#FF85A2"/>
  <circle cx="96" cy="70" r="1.5" fill="#5C1024"/>
  <circle cx="96" cy="74" r="1.5" fill="#5C1024"/>
  <!-- Eye -->
  <circle cx="86" cy="65" r="3" fill="#141922"/>
  <circle cx="87" cy="64" r="1" fill="#FFFFFF"/>
  <!-- Ear -->
  <path d="M78 56 L85 44 L90 56 Z" fill="#FF6B8B"/>
  <!-- Legs -->
  <rect x="44" y="94" width="9" height="10" rx="4" fill="#FF6B8B"/>
  <rect x="70" y="94" width="9" height="10" rx="4" fill="#FF6B8B"/>
  <!-- Curly Tail -->
  <path d="M28 72 Q22 68 24 64 T28 66" fill="none" stroke="#FF6B8B" stroke-width="3" stroke-linecap="round"/>

  <!-- Coin Slot -->
  <rect x="52" y="49" width="18" height="4" rx="2" fill="#8C1835"/>

  <!-- Dropping Golden Coin with Glow -->
  <ellipse cx="61" cy="36" rx="14" ry="14" fill="url(#coinGrad)" filter="url(#glow)"/>
  <circle cx="61" cy="36" r="10" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
  <text x="61" y="41" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#78350F" text-anchor="middle">₹</text>

  <!-- Sparkles -->
  <path d="M36 40 L38 44 L42 46 L38 48 L36 52 L34 48 L30 46 L34 44 Z" fill="#FCD34D"/>
</svg>