<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Boredom Buster Adventure Wheel Icon -->
  <g transform="translate(64,64)">
    <!-- Outer Ring -->
    <circle r="42" fill="none" stroke="url(#wheelGrad)" stroke-width="6" filter="url(#glow)"/>
    <circle r="46" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
    
    <!-- 8 Wheel Wedges -->
    <path d="M 0 0 L 0 -38 A 38 38 0 0 1 26.87 -26.87 Z" fill="#F59E0B" opacity="0.85"/>
    <path d="M 0 0 L 26.87 -26.87 A 38 38 0 0 1 38 0 Z" fill="#38BDF8" opacity="0.85"/>
    <path d="M 0 0 L 38 0 A 38 38 0 0 1 26.87 26.87 Z" fill="#10B981" opacity="0.85"/>
    <path d="M 0 0 L 26.87 26.87 A 38 38 0 0 1 0 38 Z" fill="#EC4899" opacity="0.85"/>
    <path d="M 0 0 L 0 38 A 38 38 0 0 1 -26.87 26.87 Z" fill="#8B5CF6" opacity="0.85"/>
    <path d="M 0 0 L -26.87 26.87 A 38 38 0 0 1 -38 0 Z" fill="#F97316" opacity="0.85"/>
    <path d="M 0 0 L -38 0 A 38 38 0 0 1 -26.87 -26.87 Z" fill="#06B6D4" opacity="0.85"/>
    <path d="M 0 0 L -26.87 -26.87 A 38 38 0 0 1 0 -38 Z" fill="#EAB308" opacity="0.85"/>
    
    <!-- Center Hub & Arrow Pointer -->
    <circle r="14" fill="#0F172A" stroke="#FFF" stroke-width="2.5"/>
    <polygon points="0,-22 -7,-12 7,-12" fill="#FFF" filter="url(#glow)"/>
    <circle r="6" fill="#F59E0B"/>
    
    <!-- Sparkles -->
    <polygon points="38,-38 41,-32 47,-32 42,-28 44,-22 38,-26 32,-22 34,-28 29,-32 35,-32" fill="#FDE047" opacity="0.9"/>
  </g>
</svg>
