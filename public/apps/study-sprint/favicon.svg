<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18202C"/>
      <stop offset="100%" stop-color="#0C0F14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FB0A8"/>
      <stop offset="100%" stop-color="#388E87"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B942"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#2A3545" stroke-width="2.5"/>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="none" stroke="#4FB0A8" stroke-width="1" opacity="0.4"/>

  <!-- Open Book Base -->
  <path d="M28 82 C42 78 56 82 64 88 C72 82 86 78 100 82 L100 46 C86 42 72 46 64 52 C56 46 42 42 28 46 Z" fill="url(#accentGrad)" opacity="0.95"/>
  <path d="M64 52 L64 88" stroke="#0C0F14" stroke-width="3" stroke-linecap="round"/>

  <!-- Pages Detail -->
  <path d="M34 52 C44 49 54 52 61 56" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M34 60 C44 57 54 60 61 64" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M34 68 C44 65 54 68 61 72" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <path d="M67 56 C74 52 84 49 94 52" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M67 64 C74 60 84 57 94 60" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M67 72 C74 68 84 65 94 68" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Lightning Sprint Bolt / Star -->
  <path d="M68 20 L52 38 L62 38 L58 52 L76 34 L65 34 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Bookmark Ribbon -->
  <path d="M62 88 L64 98 L66 88" fill="#E3A63E" stroke="#E3A63E" stroke-width="2" stroke-linejoin="round"/>
</svg>