<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sarav's World — scroll-driven motion</title>
  <meta name="theme-color" content="#07151f" />

  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />

  <link rel="stylesheet" href="styles.css" />

  <!-- Babel standalone for in-browser JSX transform -->
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
          integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
          crossorigin="anonymous"></script>

  <!-- Map module specifiers so framer-motion and React share one instance via esm.sh. -->
  <script type="importmap">
  {
    "imports": {
      "react":            "https://esm.sh/react@18.3.1",
      "react-dom":        "https://esm.sh/react-dom@18.3.1?external=react",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
      "framer-motion":    "https://esm.sh/framer-motion@10.18.0?external=react,react-dom"
    }
  }
  </script>

  <!-- Resolve React + FM, hang them on window, then trigger app mount. -->
  <script type="module">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import * as fm from "framer-motion";
    window.React = React;
    window.ReactDOM = { createRoot };
    window.fm = fm;
    window.__libsReady = true;
    window.dispatchEvent(new Event("libs-ready"));
  </script>
</head>
<body>
  <div id="root"></div>

  <!-- Order matters: data → leaves → composites → app -->
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="hero.jsx"></script>
  <script type="text/babel" src="journey.jsx"></script>
  <script type="text/babel" src="books.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
